name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    name: Lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check

  e2e:
    name: E2E (${{ matrix.os }} / ${{ matrix.channel }})
    needs: lint-unit
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # OS dimension: Linux covers the common path; macOS catches real
        # chrome.downloads differences. Windows omitted -- the cross-platform
        # filename rules are tested in plain JS in the unit suite.
        #
        # Channel: Chrome for Testing only. It's the same Chromium engine as
        # Chrome stable, just packaged for automation. Chrome stable in
        # headless mode does not reliably load unpacked extensions, so it's
        # not a useful CI target; users still get tested behavior because
        # auto-updating Chrome converges to the same Chromium versions.
        os: [ubuntu-latest, macos-latest]
        channel: [chromium]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # --with-deps installs the browser binary AND any OS-level libraries
      # Playwright needs on Linux. No-op on macOS/Windows for system libs.
      - run: npx playwright install --with-deps ${{ matrix.channel }}
      - env:
          PW_CHANNEL: ${{ matrix.channel }}
        run: npm run test:e2e
