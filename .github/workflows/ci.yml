name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    name: Lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check

  e2e:
    name: E2E (${{ matrix.os }})
    needs: lint-unit
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Linux covers the common path; macOS catches real chrome.downloads
        # differences. Windows is intentionally omitted -- the cross-platform
        # filename rules are tested in plain JS in the unit suite, so a
        # Windows e2e run wouldn't catch anything new.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # --with-deps installs OS-level libraries Playwright needs on Linux;
      # it's a no-op on macOS/Windows runners that already ship them.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
