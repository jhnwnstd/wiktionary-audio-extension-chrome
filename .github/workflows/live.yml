name: Live smoke

# Run the live Wiktionary sweep on demand and weekly. Kept out of the
# PR-blocking CI because it depends on network + real Wikimedia content,
# which can rate-limit or change in ways that aren't extension regressions.
on:
  workflow_dispatch:
  schedule:
    # First of each month at 12:00 UTC. Monthly is enough to surface upstream
    # Wikimedia API drift; weekly would hit a nonprofit's API ~4x more often
    # for the same signal.
    - cron: '0 12 1 * *'

permissions:
  contents: read

jobs:
  live:
    name: Live Wiktionary sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
